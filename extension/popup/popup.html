<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>MovieHub Sync</title>
    <link rel="stylesheet" href="popup.css">
</head>

<body>
    <div class="container">
        <div class="header">
            <span class="logo">🎬</span>
            <h1>MovieHub</h1>
        </div>

        <div id="status-bar" class="status-bar">
            <div class="status-dot" id="status-dot"></div>
            <span id="status-text">Not connected</span>
        </div>

        <!-- Not Connected View -->
        <div id="connect-view" class="view">
            <div class="section">
                <button id="create-btn" class="btn btn-primary">
                    Create Room
                </button>
            </div>

            <div class="divider"><span>or</span></div>

            <div class="section">
                <input type="text" id="room-input" placeholder="Enter code" maxlength="6">
                <button id="join-btn" class="btn btn-secondary">
                    Join
                </button>
            </div>
        </div>

        <!-- Connected View -->
        <div id="room-view" class="view hidden">
            <div class="room-code-box">
                <span class="label">Room Code</span>
                <div class="code-display">
                    <span id="room-code">------</span>
                    <button id="copy-btn" class="btn-icon">📋</button>
                </div>
            </div>

            <div id="video-status" class="video-status">
                <span id="video-status-icon">⏳</span>
                <span id="video-status-text">Looking for video...</span>
            </div>

            <button id="leave-btn" class="btn btn-danger">
                Leave Room
            </button>
        </div>
    </div>

    <script src="popup.js"></script>
</body>

</html>
